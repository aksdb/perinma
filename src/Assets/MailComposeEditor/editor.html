<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: transparent;
            color: CanvasText;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            border-bottom: 1px solid rgba(127, 127, 127, 0.25);
            background: color-mix(in srgb, Canvas 94%, CanvasText 6%);
        }

        .toolbar button {
            border: 1px solid rgba(127, 127, 127, 0.35);
            border-radius: 4px;
            background: transparent;
            color: inherit;
            padding: 4px 8px;
            font: inherit;
            cursor: pointer;
        }

        .toolbar button:hover {
            background: rgba(127, 127, 127, 0.12);
        }

        #editorShell {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        #editor {
            height: 100%;
            min-height: 0;
            padding: 12px;
            outline: none;
            overflow: auto;
            line-height: 1.5;
            word-break: break-word;
            caret-color: transparent;
        }

        #editor p {
            margin: 0 0 0.9em;
        }

        #editor img {
            max-width: 100%;
            height: auto;
        }

        #editor blockquote {
            margin: 1em 0;
            padding-left: 1em;
            border-left: 3px solid rgba(127, 127, 127, 0.35);
        }

        #editor pre {
            white-space: pre-wrap;
            background: rgba(127, 127, 127, 0.08);
            padding: 8px;
            border-radius: 4px;
        }

        #caretOverlay {
            position: fixed;
            display: none;
            width: 2px;
            border-radius: 1px;
            background: #0a84ff;
            pointer-events: none;
            z-index: 2147483647;
            animation: caretBlink 1s steps(1, end) infinite;
        }

        @keyframes caretBlink {
            0%, 45% {
                opacity: 1;
            }

            50%, 100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button type="button" data-command="bold"><strong>B</strong></button>
        <button type="button" data-command="italic"><em>I</em></button>
        <button type="button" data-command="underline"><u>U</u></button>
        <button type="button" data-command="strikeThrough"><s>S</s></button>
        <button type="button" data-command="insertUnorderedList">• List</button>
        <button type="button" data-command="insertOrderedList">1. List</button>
        <button type="button" data-action="quote">Quote</button>
        <button type="button" data-action="code">Code</button>
        <button type="button" data-action="link">Link</button>
        <button type="button" data-action="clear">Clear</button>
    </div>
    <div id="editorShell">
        <div id="editor" contenteditable="true" spellcheck="true"></div>
    </div>
    <div id="caretOverlay" aria-hidden="true"></div>

    <script>
        (() => {
            const editor = document.getElementById('editor');
            const toolbar = document.querySelector('.toolbar');
            const caretOverlay = document.getElementById('caretOverlay');
            let notifyTimer = null;
            let caretFrame = 0;

            function send(message) {
                if (typeof window.invokeCSharpAction === 'function') {
                    window.invokeCSharpAction(JSON.stringify(message));
                }
            }

            function placeCaretAtEnd() {
                const selection = window.getSelection();
                if (!selection) {
                    return;
                }

                const range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
                selection.removeAllRanges();
                selection.addRange(range);
            }

            function hideCaret() {
                caretOverlay.style.display = 'none';
            }

            function isSelectionInsideEditor(selection) {
                return !!selection
                    && selection.rangeCount > 0
                    && editor.contains(selection.anchorNode)
                    && editor.contains(selection.focusNode);
            }

            function measureCaretRect(selection) {
                const range = selection.getRangeAt(0).cloneRange();
                let rect = range.getClientRects()[0] || range.getBoundingClientRect();
                if (rect && (rect.width > 0 || rect.height > 0)) {
                    return rect;
                }

                const marker = document.createElement('span');
                marker.textContent = '\u200b';
                marker.style.display = 'inline-block';
                marker.style.width = '0';
                marker.style.overflow = 'hidden';
                range.insertNode(marker);

                rect = marker.getBoundingClientRect();
                range.setStartBefore(marker);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
                marker.remove();
                return rect;
            }

            function updateCaret() {
                caretFrame = 0;

                const selection = window.getSelection();
                if (!selection
                    || !selection.isCollapsed
                    || document.activeElement !== editor
                    || !isSelectionInsideEditor(selection)) {
                    hideCaret();
                    return;
                }

                const rect = measureCaretRect(selection);
                if (!rect
                    || !Number.isFinite(rect.left)
                    || !Number.isFinite(rect.top)) {
                    hideCaret();
                    return;
                }

                const editorRect = editor.getBoundingClientRect();
                if (rect.bottom < editorRect.top
                    || rect.top > editorRect.bottom
                    || rect.right < editorRect.left
                    || rect.left > editorRect.right) {
                    hideCaret();
                    return;
                }

                const fallbackHeight = parseFloat(getComputedStyle(editor).lineHeight) || 22;
                const height = Math.max(rect.height || 0, fallbackHeight);
                caretOverlay.style.left = `${Math.round(rect.left)}px`;
                caretOverlay.style.top = `${Math.round(rect.top)}px`;
                caretOverlay.style.height = `${Math.round(height)}px`;
                caretOverlay.style.display = 'block';
            }

            function requestCaretUpdate() {
                if (caretFrame) {
                    cancelAnimationFrame(caretFrame);
                }

                caretFrame = requestAnimationFrame(updateCaret);
            }

            function normalizeEmpty() {
                if (!editor.innerHTML || editor.innerHTML === '<br>') {
                    editor.innerHTML = '<p><br></p>';
                }
            }

            function scheduleNotify() {
                clearTimeout(notifyTimer);
                notifyTimer = setTimeout(() => {
                    send({
                        type: 'contentChanged',
                        html: editor.innerHTML,
                        plainText: editor.innerText || ''
                    });
                }, 120);
            }

            function focusEditor() {
                editor.focus();

                const selection = window.getSelection();
                const hasCaretInEditor = selection
                    && selection.rangeCount > 0
                    && editor.contains(selection.anchorNode);
                if (!hasCaretInEditor) {
                    placeCaretAtEnd();
                }

                requestCaretUpdate();
            }

            function exec(command) {
                focusEditor();
                document.execCommand(command, false, null);
                normalizeEmpty();
                scheduleNotify();
                requestCaretUpdate();
            }

            function insertHtml(html) {
                focusEditor();
                document.execCommand('insertHTML', false, html);
                normalizeEmpty();
                scheduleNotify();
                requestCaretUpdate();
            }

            function promptForLink() {
                const url = window.prompt('Enter a URL', 'https://');
                if (!url) {
                    return;
                }

                focusEditor();
                document.execCommand('createLink', false, url);
                scheduleNotify();
                requestCaretUpdate();
            }

            toolbar.addEventListener('click', event => {
                const button = event.target.closest('button');
                if (!button) {
                    return;
                }

                const command = button.dataset.command;
                if (command) {
                    exec(command);
                    return;
                }

                switch (button.dataset.action) {
                    case 'quote':
                        insertHtml('<blockquote><p><br></p></blockquote>');
                        return;
                    case 'code':
                        insertHtml('<pre><code><br></code></pre>');
                        return;
                    case 'link':
                        promptForLink();
                        return;
                    case 'clear':
                        editor.innerHTML = '<p><br></p>';
                        scheduleNotify();
                        requestCaretUpdate();
                        return;
                }
            });

            editor.addEventListener('focus', () => {
                const selection = window.getSelection();
                const hasCaretInEditor = selection
                    && selection.rangeCount > 0
                    && editor.contains(selection.anchorNode);
                if (!hasCaretInEditor) {
                    placeCaretAtEnd();
                }

                requestCaretUpdate();
            });

            editor.addEventListener('blur', hideCaret);

            editor.addEventListener('input', () => {
                normalizeEmpty();
                scheduleNotify();
                requestCaretUpdate();
            });

            editor.addEventListener('keydown', event => {
                if (event.key === 'Tab') {
                    event.preventDefault();
                    document.execCommand('insertHTML', false, '&emsp;');
                    scheduleNotify();
                }

                requestCaretUpdate();
            });

            editor.addEventListener('keyup', requestCaretUpdate);
            editor.addEventListener('click', requestCaretUpdate);
            editor.addEventListener('mouseup', requestCaretUpdate);
            editor.addEventListener('scroll', requestCaretUpdate);

            document.addEventListener('selectionchange', () => {
                if (document.activeElement === editor) {
                    requestCaretUpdate();
                    return;
                }

                hideCaret();
            });

            window.perinmaEditor = {
                setHtml(html) {
                    editor.innerHTML = html && html.trim().length > 0 ? html : '<p><br></p>';
                    requestCaretUpdate();
                },
                focus() {
                    focusEditor();
                },
                insertImage(src, alt) {
                    const safeAlt = alt || '';
                    insertHtml(`<img src="${src}" alt="${safeAlt}">`);
                }
            };

            normalizeEmpty();
            scheduleNotify();
            requestCaretUpdate();
        })();
    </script>
</body>
</html>
