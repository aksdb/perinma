<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: transparent;
            color: CanvasText;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            border-bottom: 1px solid rgba(127, 127, 127, 0.25);
            background: color-mix(in srgb, Canvas 94%, CanvasText 6%);
        }

        .toolbar button {
            border: 1px solid rgba(127, 127, 127, 0.35);
            border-radius: 4px;
            background: transparent;
            color: inherit;
            padding: 4px 8px;
            font: inherit;
            cursor: pointer;
        }

        .toolbar button:hover {
            background: rgba(127, 127, 127, 0.12);
        }

        #editor {
            flex: 1;
            min-height: 0;
            padding: 12px;
            outline: none;
            overflow: auto;
            line-height: 1.5;
            word-break: break-word;
            caret-color: Highlight;
        }

        #editor p {
            margin: 0 0 0.9em;
        }

        #editor img {
            max-width: 100%;
            height: auto;
        }

        #editor blockquote {
            margin: 1em 0;
            padding-left: 1em;
            border-left: 3px solid rgba(127, 127, 127, 0.35);
        }

        #editor pre {
            white-space: pre-wrap;
            background: rgba(127, 127, 127, 0.08);
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button type="button" data-command="bold"><strong>B</strong></button>
        <button type="button" data-command="italic"><em>I</em></button>
        <button type="button" data-command="underline"><u>U</u></button>
        <button type="button" data-command="strikeThrough"><s>S</s></button>
        <button type="button" data-command="insertUnorderedList">• List</button>
        <button type="button" data-command="insertOrderedList">1. List</button>
        <button type="button" data-action="quote">Quote</button>
        <button type="button" data-action="code">Code</button>
        <button type="button" data-action="link">Link</button>
        <button type="button" data-action="clear">Clear</button>
    </div>
    <div id="editor" contenteditable="true" spellcheck="true"></div>

    <script>
        (() => {
            const editor = document.getElementById('editor');
            const toolbar = document.querySelector('.toolbar');
            let notifyTimer = null;

            function send(message) {
                if (typeof window.invokeCSharpAction === 'function') {
                    window.invokeCSharpAction(JSON.stringify(message));
                }
            }

            function placeCaretAtEnd() {
                const selection = window.getSelection();
                if (!selection) {
                    return;
                }

                const range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
                selection.removeAllRanges();
                selection.addRange(range);
            }

            function normalizeEmpty() {
                if (!editor.innerHTML || editor.innerHTML === '<br>') {
                    editor.innerHTML = '<p><br></p>';
                }
            }

            function scheduleNotify() {
                clearTimeout(notifyTimer);
                notifyTimer = setTimeout(() => {
                    send({
                        type: 'contentChanged',
                        html: editor.innerHTML,
                        plainText: editor.innerText || ''
                    });
                }, 120);
            }

            function focusEditor() {
                editor.focus();

                const selection = window.getSelection();
                const hasCaretInEditor = selection && selection.rangeCount > 0 && editor.contains(selection.anchorNode);
                if (!hasCaretInEditor) {
                    placeCaretAtEnd();
                }
            }

            function exec(command) {
                focusEditor();
                document.execCommand(command, false, null);
                normalizeEmpty();
                scheduleNotify();
            }

            function insertHtml(html) {
                focusEditor();
                document.execCommand('insertHTML', false, html);
                normalizeEmpty();
                scheduleNotify();
            }

            function toggleQuote() {
                exec('formatBlock', 'blockquote');
            }

            function toggleCodeBlock() {
                insertHtml('<pre><code><br></code></pre>');
            }

            function promptForLink() {
                const url = window.prompt('Enter a URL', 'https://');
                if (!url) {
                    return;
                }

                focusEditor();
                document.execCommand('createLink', false, url);
                scheduleNotify();
            }

            toolbar.addEventListener('click', event => {
                const button = event.target.closest('button');
                if (!button) {
                    return;
                }

                const command = button.dataset.command;
                if (command) {
                    exec(command);
                    return;
                }

                switch (button.dataset.action) {
                    case 'quote':
                        insertHtml('<blockquote><p><br></p></blockquote>');
                        return;
                    case 'code':
                        toggleCodeBlock();
                        return;
                    case 'link':
                        promptForLink();
                        return;
                    case 'clear':
                        editor.innerHTML = '<p><br></p>';
                        scheduleNotify();
                        return;
                }
            });

            editor.addEventListener('focus', () => {
                const selection = window.getSelection();
                const hasCaretInEditor = selection && selection.rangeCount > 0 && editor.contains(selection.anchorNode);
                if (!hasCaretInEditor) {
                    placeCaretAtEnd();
                }
            });

            editor.addEventListener('input', () => {
                normalizeEmpty();
                scheduleNotify();
            });

            editor.addEventListener('keydown', event => {
                if (event.key === 'Tab') {
                    event.preventDefault();
                    document.execCommand('insertHTML', false, '&emsp;');
                    scheduleNotify();
                }
            });

            window.perinmaEditor = {
                setHtml(html) {
                    editor.innerHTML = html && html.trim().length > 0 ? html : '<p><br></p>';
                },
                focus() {
                    focusEditor();
                },
                insertImage(src, alt) {
                    const safeAlt = alt || '';
                    insertHtml(`<img src="${src}" alt="${safeAlt}">`);
                }
            };

            normalizeEmpty();
            scheduleNotify();
        })();
    </script>
</body>
</html>
